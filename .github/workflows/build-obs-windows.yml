name: Build OBS Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-obs-${{ github.ref }}
  cancel-in-progress: true

# 注意：RUSTFLAGS 只在 Tauri 构建那一步设置。
# 全局设置会让 cargo install（typeshare 及其 proc-macro）也用 /MT，容易节外生枝。

jobs:
  build:
    name: Windows x64 (native 17890)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure typeshare 1.13.4
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $typeshare = Join-Path $cargoBin "typeshare.exe"
          $need = $true
          if (Test-Path $typeshare) {
            $v = & $typeshare --version
            if ($v -match "1\.13\.4") { $need = $false }
          }
          if ($need) {
            cargo install typeshare-cli --version 1.13.4 --locked --force
          }
          & $typeshare --version
          $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show tool versions
        shell: bash
        run: |
          node -v
          pnpm -v
          rustc -V
          cargo -V
          python -V

      - name: Fetch ASR / VAD models
        run: pnpm fetch:model

      - name: Fetch MT models (optional)
        # 翻译模型只影响字幕翻译，失败不阻断 OBS 字幕构建
        continue-on-error: true
        run: pnpm fetch:mt

      - name: Clean download caches
        run: Remove-Item -Recurse -Force .cache -ErrorAction SilentlyContinue

      - name: Build Tauri app (NSIS)
        env:
          # ct2rs / sherpa-onnx 的 CMake 产物用 /MT，Rust 默认 /MD，必须静态 CRT
          RUSTFLAGS: -C target-feature=+crt-static
        run: pnpm tauri build --bundles nsis

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: AudioScript-OBS-Windows-x64
          path: |
            src-tauri/target/release/AudioScript.exe
            src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
